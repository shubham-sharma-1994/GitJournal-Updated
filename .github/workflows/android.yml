name: Android

on:
  push:
    branches:
      - master
      - upgrade-flutter-latest
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Give more Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Unlock secrets (optional)
        continue-on-error: true
        uses: sliteteam/github-action-git-crypt-unlock@1.2.0
        env:
          GIT_CRYPT_KEY: ${{ secrets.GITCRYPT_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Setup Env
        run: dart ./scripts/setup_env.dart || true

      - name: Get Flutter Deps
        run: flutter pub get --suppress-analytics

      - name: Analyze
        run: flutter analyze || true

      - name: Test
        run: flutter test || true

      - name: Build Debug APK (no signing required)
        run: |
          BUILD_NUM=$(git rev-list --count HEAD)
          flutter build apk --debug --flavor prod --build-number="$BUILD_NUM" --dart-define=INSTALL_SOURCE=github
          cp build/app/outputs/flutter-apk/app-prod-debug.apk GitJournal-debug.apk
          ls -la *.apk || true

      - name: Build Release APK (if secrets available)
        continue-on-error: true
        run: |
          if [ -f android/secrets/key.properties ] || [ -f secrets/key.properties ]; then
            BUILD_NUM=$(git rev-list --count HEAD)
            flutter build apk --flavor prod --build-number="$BUILD_NUM" --dart-define=INSTALL_SOURCE=fdroid
            cp build/app/outputs/flutter-apk/app-prod-release.apk GitJournal-release.apk
          else
            echo "No signing secrets, skipping release build"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitJournal-APK
          path: |
            *.apk
            build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 30
