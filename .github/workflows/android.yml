name: Android

on:
  workflow_dispatch:
  push:
    branches:
      - upgrade-flutter-latest

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Unlock secrets (optional)
        continue-on-error: true
        uses: sliteteam/github-action-git-crypt-unlock@1.2.0
        env:
          GIT_CRYPT_KEY: ${{ secrets.GITCRYPT_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Configure Android SDK path
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          mkdir -p "$HOME/android-sdk"

      - name: Install Android cmdline-tools
        run: |
          set -eux
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          rm -rf /tmp/cmdtools-tmp
          unzip -q cmdtools.zip -d /tmp/cmdtools-tmp
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdtools-tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -eux
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          ls -la "$ANDROID_HOME"

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Setup Env
        run: dart ./scripts/setup_env.dart || true

      - name: Get Flutter Deps
        run: flutter pub get --suppress-analytics

      - name: Build Debug APK
        run: |
          set -eux
          BUILD_NUM=$(git rev-list --count HEAD)
          flutter build apk --debug --flavor prod --build-number="$BUILD_NUM" --dart-define=INSTALL_SOURCE=github
          cp build/app/outputs/flutter-apk/app-prod-debug.apk GitJournal-debug.apk
          ls -la GitJournal-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GitJournal-APK
          path: GitJournal-debug.apk
          if-no-files-found: error
          retention-days: 30
