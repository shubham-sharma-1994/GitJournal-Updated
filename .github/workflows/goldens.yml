name: Goldens

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - upgrade-flutter-latest
    paths:
      - "test/golden/**"
      - "pubspec.yaml"
      - "lib/themes.dart"
      - "lib/design/**"
      - "lib/screens/**"
      - "lib/widgets/app_drawer.dart"
      - "lib/settings/settings_screen.dart"
      - "lib/editors/**"
      - ".github/workflows/goldens.yml"

concurrency:
  group: goldens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Get deps
        run: flutter pub get --suppress-analytics

      - name: Regenerate goldens (M2 intentional visual change)
        run: flutter test test/golden --update-goldens

      - name: Upload regenerated goldens
        uses: actions/upload-artifact@v4
        with:
          name: golden-baselines
          path: test/golden/**/*.png
          if-no-files-found: warn

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            test/golden/**
            **/failures/**
          if-no-files-found: warn
