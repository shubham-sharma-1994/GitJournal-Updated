name: Goldens

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - upgrade-flutter-latest

concurrency:
  group: goldens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get --suppress-analytics
      - name: Update goldens for icon changes
        run: flutter test test/golden --update-goldens
      - uses: actions/upload-artifact@v4
        with:
          name: golden-baselines
          path: test/golden/**/*.png
