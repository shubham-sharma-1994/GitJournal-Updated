name: Goldens

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - upgrade-flutter-latest
    paths:
      - "test/golden/**"
      - "pubspec.yaml"
      - "lib/themes.dart"
      - "lib/design/**"
      - "lib/screens/**"
      - "lib/widgets/**"
      - "lib/settings/**"
      - "lib/editors/**"
      - ".github/workflows/goldens.yml"

concurrency:
  group: goldens-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - run: flutter pub get --suppress-analytics
      - run: flutter test test/golden
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: |
            test/golden/**
            **/failures/**
          if-no-files-found: warn
